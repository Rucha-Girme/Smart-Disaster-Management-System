<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Smart Disaster Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

background:
linear-gradient(rgba(13,110,253,.55),rgba(0,40,80,.70)),
url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

}

.register-card{

width:460px;

background:rgba(255,255,255,.16);

backdrop-filter:blur(18px);

border-radius:25px;

padding:40px;

box-shadow:0 10px 35px rgba(0,0,0,.35);

color:white;

}

.logo{

font-size:45px;
text-align:center;

}

.title{

font-size:30px;
font-weight:bold;
text-align:center;
margin-top:10px;

}

.subtitle{

text-align:center;
margin-bottom:30px;
opacity:.9;

}

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:#0d6efd;
color:white;
border:none;

}

.form-control{

height:52px;
border:none;

}

.form-control:focus{

box-shadow:none;

}

.btn-register{

width:100%;
height:55px;

font-size:20px;
font-weight:bold;

border:none;
border-radius:12px;

background:linear-gradient(90deg,#0d6efd,#00a2ff);

transition:.3s;

}

.btn-register:hover{

transform:scale(1.03);

}

.login{

text-align:center;
margin-top:25px;

}

.login a{

color:#ffd54f;
text-decoration:none;
font-weight:bold;

}

.login a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="register-card">

<div class="logo">

🌍

</div>

<div class="title">

Smart Disaster Prediction

</div>

<div class="subtitle">

Create Your Account 🚀

</div>

<form method="POST" action="/register">

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-user"></i>

</span>

<input
type="text"
name="fullname"
class="form-control"
placeholder="Full Name"
required>

</div>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-envelope"></i>

</span>

<input
type="email"
name="email"
class="form-control"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-lock"></i>

</span>

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Create Password"
required>
<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-eye"
onclick="togglePassword()"
style="cursor:pointer;"></i>

</span>

</div>

<div class="mb-3">

<small class="text-light">

Password should contain at least 8 characters.

</small>

</div>

<button
type="submit"
class="btn btn-register">

<i class="fa-solid fa-user-plus"></i>

Register

</button>

</form>

<div class="login">

Already have an account?

<br><br>

<a href="/login">

Login Here

</a>

</div>

</div>

<script>

function togglePassword(){

var x=document.getElementById("password");

if(x.type==="password"){

x.type="text";

}

else{

x.type="password";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
