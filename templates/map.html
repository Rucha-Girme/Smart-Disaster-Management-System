<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Safe Zone Map</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef4fb;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

iframe{
    width:100%;
    height:600px;
    border:none;
}

</style>

</head>

<body>

<nav class="navbar navbar-success bg-success">

<div class="container">

<a class="navbar-brand text-white fw-bold fs-3">

🗺 Safe Zone Map

</a>

<a href="/dashboard" class="btn btn-light">

Dashboard

</a>

</div>

</nav>


<div class="container mt-5">

<div class="card">

<div class="card-header bg-success text-white">

<h4>Nearby Safe Zones</h4>

</div>

<div class="card-body">

<iframe
id="mapFrame"
src="https://maps.google.com/maps?q=hospital&z=14&output=embed">
</iframe>

</div>

</div>

</div>

<div class="container mt-4 mb-5">

<div class="row g-3">

<div class="col-md-4">

<button
class="btn btn-danger w-100"
onclick="openHospital()">

🏥 Nearest Hospital

</button>

</div>

<div class="col-md-4">

<button
class="btn btn-primary w-100"
onclick="openPolice()">

🚓 Police Station

</button>

</div>

<div class="col-md-4">

<button
class="btn btn-warning w-100"
onclick="openFire()">

🚒 Fire Station

</button>

</div>

</div>

</div>

<script>

function openHospital(){

navigator.geolocation.getCurrentPosition(function(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

window.open(
`https://www.google.com/maps/search/hospital/@${lat},${lon},15z`
);

});

}

function openPolice(){

navigator.geolocation.getCurrentPosition(function(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

window.open(
`https://www.google.com/maps/search/police/@${lat},${lon},15z`
);

});

}

function openFire(){

navigator.geolocation.getCurrentPosition(function(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

window.open(
`https://www.google.com/maps/search/fire+station/@${lat},${lon},15z`
);

});

}

</script>

</body>

</html>
