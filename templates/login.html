<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Smart Disaster Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

background:
linear-gradient(rgba(13,110,253,.55),rgba(0,40,80,.70)),
url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

}

.login-card{

width:430px;

background:rgba(255,255,255,.16);

backdrop-filter:blur(16px);

border-radius:25px;

padding:40px;

box-shadow:0 10px 35px rgba(0,0,0,.35);

color:white;

}

.logo{

font-size:45px;

text-align:center;

}

.title{

font-size:30px;

font-weight:bold;

text-align:center;

margin-top:10px;

}

.subtitle{

text-align:center;

margin-bottom:30px;

opacity:.9;

}

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:#0d6efd;

color:white;

border:none;

}

.form-control{

height:52px;

border:none;

}

.form-control:focus{

box-shadow:none;

}

.btn-login{

width:100%;

height:55px;

font-size:20px;

font-weight:bold;

border-radius:12px;

background:linear-gradient(90deg,#0d6efd,#00a2ff);

border:none;

transition:.3s;

}

.btn-login:hover{

transform:scale(1.03);

}

.extra{

display:flex;

justify-content:space-between;

margin-top:15px;

font-size:15px;

}

.extra a{

color:#fff;

text-decoration:none;

}

.extra a:hover{

text-decoration:underline;

}

.register{

text-align:center;

margin-top:25px;

}

.register a{

color:#ffd54f;

text-decoration:none;

font-weight:bold;

}

.register a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">

🌍

</div>

<div class="title">

Smart Disaster Prediction

</div>

<div class="subtitle">

Welcome Back 👋

Login to continue

</div>

<form method="POST" action="/login">

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-envelope"></i>

</span>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-lock"></i>

</span>

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>
<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-eye" onclick="togglePassword()"
style="cursor:pointer;"></i>

</span>

</div>

<div class="extra">

<div>

<input
type="checkbox"
class="form-check-input"
id="remember">

<label for="remember">

Remember Me

</label>

</div>

<div>

<a href="/forgot_password">

Forgot Password?

</a>

</div>

</div>

<button
type="submit"
class="btn btn-login mt-4">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</form>

<div class="register">

Don't have an account?

<br><br>

<a href="/register">

Create Account

</a>

</div>

</div>

<script>

function togglePassword(){

var x=document.getElementById("password");

if(x.type==="password"){

x.type="text";

}else{

x.type="password";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
