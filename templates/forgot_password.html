<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(rgba(13,110,253,.55),rgba(0,40,80,.75)),

url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1600&q=80");

background-size:cover;

font-family:Segoe UI;

}

.card{

width:450px;

padding:40px;

border-radius:20px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

color:white;

}

.form-control{

height:50px;

}

.btn{

height:50px;

font-size:18px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<h2 class="text-center mb-4">

🔑 Reset Password

</h2>

<form method="POST">

<div class="mb-3">

<label>Email</label>

<input

type="email"

name="email"

class="form-control"

required>

</div>

<div class="mb-3">

<label>New Password</label>

<input

type="password"

name="password"

class="form-control"

required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input

type="password"

name="confirm"

class="form-control"

required>

</div>

<button

class="btn btn-primary w-100"

type="submit">

Update Password

</button>

</form>

<br>

<div class="text-center">

<a href="/login" class="text-warning">

Back to Login

</a>

</div>

</div>

</body>

</html>
